<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
</head>
<body>
	
	<form action="submit">
		<fieldset>
			<legend>choose gender</legend>

			<label for="m">Male</label>
			<input type="radio" id="m" name="gender" value="m"> 

			<label for="f">female</label>
			<input type="radio" id="f" name="gender" value="f"> 

			<input type="submit" value="submit">
		</fieldset>

		<br><br>
		<fieldset>
			<legend>Agree terms and conditions</legend>
			
			<input type="checkbox" id="a" name="agree"
			value="yes" checked>

			<label for="a">i agree</label>

			<br><br>
			<input type="checkbox" id="n" name="not_agree"
			value="yes">
			<label for="n">not agree</label>

			<button>submit</button>

		</fieldset>

	</form>
	<br><br>
	<form action="food">
		<fieldset>
			<legend>choose your food</legend>
			<label for="f">foods</label>
			<select name="food" id="f">
				<option value="k">kabak</option>
				<option value="m">manto</option>
				<option value="q">قابلی</option>
				<option value="a">آشک</option>
			</select>
			<button>submit</button>

		</fieldset>



	</form>



</body>
</html>
